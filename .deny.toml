[graph]
all-features = true
# >>> custom graph
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# <<< custom graph

[advisories]
# >>> custom advisories
ignore = []
# <<< custom advisories

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # >>> custom licenses_allow
    # <<< custom licenses_allow
]
unused-allowed-license = "allow"
# >>> custom licenses
# <<< custom licenses

[licenses.private]
ignore = true

[bans]
# >>> custom bans
deny = [
    { crate = "libssh2-sys", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
    { crate = "russh", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
    { crate = "ssh2", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
]
# Duplicates pulled in by up-to-date dependencies; drop an entry once cargo-deny reports it unused.
skip = [
    { crate = "lock_api@0.4.14", reason = "crossterm and i18n-embed still use parking_lot 0.12" },
    { crate = "parking_lot@0.12.5", reason = "crossterm and i18n-embed still use parking_lot 0.12" },
    { crate = "parking_lot_core@0.9.12", reason = "crossterm and i18n-embed still use parking_lot 0.12" },
    { crate = "syn@2.0.119", reason = "the ecosystem is still migrating to syn 3" },
    { crate = "thiserror@1.0.69", reason = "i18n-embed and i18n-config still use thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "i18n-embed and i18n-config still use thiserror 1" },
    { crate = "toml@0.5.11", reason = "find-crate 0.6 (via i18n-embed-fl) uses toml 0.5" },
]
# <<< custom bans

[sources]
unknown-registry = "deny"
unknown-git = "deny"

