# Dependabot keeps the actions in .github/workflows/ up to date, pinned to commit hashes with the
# version in a comment. The tools CI builds with `cargo install` or `go install` are pinned in
# ci.yml by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has a week to be found out before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
