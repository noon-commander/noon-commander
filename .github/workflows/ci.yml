name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs every check on the tag before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs `just ci`, everything that must pass, on macOS and Linux, so it checks what is checked
# locally. Tools are built with `cargo install` at pinned versions; rust-cache keeps them in
# ~/.cargo/bin between runs.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  JUST_VERSION: 1.59.0

jobs:
  ci:
    name: ci (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            sftp-server: /usr/libexec/sftp-server
          - name: Linux
            os: ubuntu-latest
            sftp-server: /usr/lib/openssh/sftp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: >-
          cargo install --locked "just@$JUST_VERSION" rumdl@0.3.5 cargo-deny@0.22.0
          taplo-cli@0.10.0 cargo-shear@1.14.1 zizmor@1.33.1
      # ShellCheck comes with the Linux runner only.
      - if: runner.os == 'macOS'
        name: Install ShellCheck
        run: brew install shellcheck
      # actionlint and shfmt are not Rust programs.
      - name: Install actionlint and shfmt
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      # Named rather than looked for, so that the SFTP tests fail instead of skipping without it.
      - run: just ci
        env:
          SFTP_SERVER: ${{ matrix.sftp-server }}

  release:
    name: release build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          # As release.yml builds Linux binaries: static, with musl (ADR 0089).
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal ${TARGET:+--target "$TARGET"} \
            --no-self-update
          rustup default stable
      - if: runner.os == 'Linux'
        name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just build-release ${TARGET:+--target "$TARGET"}

  msrv:
    name: MSRV (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      # The same rust-version that build-msrv reads.
      - name: Install the oldest supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - run: just build-msrv
