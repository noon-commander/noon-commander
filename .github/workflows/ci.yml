name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs every check on the tag before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every check is a recipe of the justfile, so CI runs what `just check` and `just lint` run
# locally. Tools are built with `cargo install` at pinned versions; rust-cache keeps them in
# ~/.cargo/bin between runs.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  JUST_VERSION: 1.58.0

jobs:
  format:
    name: rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just format-check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just clippy --locked

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            sftp-server: /usr/libexec/sftp-server
          - name: Linux
            os: ubuntu-latest
            sftp-server: /usr/lib/openssh/sftp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION" cargo-insta@1.49.0
      # Named rather than looked for, so that the SFTP tests fail instead of skipping without it.
      - run: just test --locked
        env:
          SFTP_SERVER: ${{ matrix.sftp-server }}
      # The tests above check the snapshots on both systems; which files they use is the same.
      - if: runner.os == 'macOS'
        run: just snap-stale

  release:
    name: release build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          # As release.yml builds Linux binaries: static, with musl (ADR 0089).
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal ${TARGET:+--target "$TARGET"} \
            --no-self-update
          rustup default stable
      - if: runner.os == 'Linux'
        name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just release ${TARGET:+--target "$TARGET"}

  msrv:
    name: MSRV (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION"
      - name: Install the oldest supported Rust
        run: rustup toolchain install "$(just --evaluate msrv)" --profile minimal --no-self-update
      - run: just msrv

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked "just@$JUST_VERSION" cargo-deny@0.20.2
      - run: just deny

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: >-
          cargo install --locked "just@$JUST_VERSION" taplo-cli@0.10.0 cargo-shear@1.14.0
          zizmor@1.30.1
      # ShellCheck comes with the runner; actionlint and markdownlint-cli2 are not Rust programs.
      # markdownlint-cli2 is installed outside the checkout, so no linter sees its node_modules.
      - name: Install actionlint and markdownlint-cli2
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          cp .github-deps/markdownlint/package.json .github-deps/markdownlint/package-lock.json \
            "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --ignore-scripts
          echo "$RUNNER_TEMP/node_modules/.bin" >>"$GITHUB_PATH"
      - run: just lint
