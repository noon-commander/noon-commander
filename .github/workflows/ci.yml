name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs every check on the tag before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every check is a recipe of the justfile, so CI runs what `just check` and `just lint` run
# locally. Tools are built with `cargo install` at pinned versions; rust-cache keeps them in
# ~/.cargo/bin between runs.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  JUST_VERSION: 1.58.0

jobs:
  fmt:
    name: rustfmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just fmt-check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: forwarding
            features: forwarding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just clippy-with "$FEATURES" --locked
        env:
          FEATURES: ${{ matrix.features }}

  test:
    name: test (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: forwarding
            features: forwarding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - run: cargo install --locked "just@$JUST_VERSION" cargo-insta@1.49.0
      - run: just test-with "$FEATURES" --locked
        env:
          FEATURES: ${{ matrix.features }}
      - if: matrix.name == 'default'
        run: just snap-stale

  release:
    name: release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked "just@$JUST_VERSION"
      - run: just release

  msrv:
    name: MSRV
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked "just@$JUST_VERSION"
      - name: Install the oldest supported Rust
        run: rustup toolchain install "$(just --evaluate msrv)" --profile minimal --no-self-update
      - run: just msrv

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked "just@$JUST_VERSION" cargo-deny@0.20.2
      - run: just deny

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: >-
          cargo install --locked "just@$JUST_VERSION" typos-cli@1.50.3 taplo-cli@0.10.0
          cargo-shear@1.14.0 zizmor@1.30.1
      # ShellCheck comes with the runner; actionlint and markdownlint-cli2 are not Rust programs.
      # markdownlint-cli2 is installed outside the checkout, so no linter sees its node_modules.
      - name: Install actionlint and markdownlint-cli2
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          cp .github/markdownlint/package.json .github/markdownlint/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --ignore-scripts
          echo "$RUNNER_TEMP/node_modules/.bin" >>"$GITHUB_PATH"
      - run: just lint
