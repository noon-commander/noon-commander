name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

# ci.yml, called below, takes `Release-<ref>` as its group, since a called workflow sees the
# caller's name; groups ignore case, so this one is named apart, or the two would wait on each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Releases are built only here, so the steps live in this workflow rather than in the justfile
# (ADR 0014). The build has no rust-cache: release binaries never come from a cache that
# another run could have written.
#
# Packages are named after the project, `noon-commander`; `noc` is only the binary inside them.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PACKAGE: noon-commander
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    name: CI
    permissions:
      contents: read # ci.yml checks out the code
    # actionlint 1.7.12 does not know the `$/` form yet; the job checks nothing out before this.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check that the tag is signed
        run: |
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '"\(.object.type) \(.object.sha)"')
          if [ "${object% *}" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi
          verification=$(gh api "repos/$GH_REPO/git/tags/${object#* }" \
            --jq '"\(.verification.verified) \(.verification.reason)"')
          if [ "${verification% *}" != true ]; then
            echo "::error::The signature of $TAG is not verified: ${verification#* }"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Take the release notes from CHANGELOG.md
        run: |
          if ! packaging/release-notes.sh "${TAG#v}" >"$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
      - name: Create the draft release
        run: >-
          gh release create "$TAG" --draft --verify-tag --title "Noon Commander ${TAG#v}"
          --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: build (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the tarball to the draft release
      id-token: write # a Sigstore certificate for the attestation
      attestations: write # store the attestation
    # Linux binaries are linked statically with musl, so that one runs on any distribution
    # (ADR 0089); each is built on a runner of its own architecture.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      # blake3 compiles C and assembly, which for musl takes musl's gcc wrapper.
      - if: runner.os == 'Linux'
        name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked -p noc --target "$TARGET"
      - if: runner.os == 'Linux'
        name: Check that noc is static
        run: |
          if readelf --program-headers "target/$TARGET/release/noc" | grep -q INTERP; then
            echo "::error::noc for $TARGET is linked dynamically"
            exit 1
          fi
      # On macOS, COPYFILE_DISABLE and --no-mac-metadata keep extended attributes out of the
      # tarball.
      - name: Pack the tarball
        run: |
          name="$PACKAGE-${TAG#v}-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/noc" LICENSE CHANGELOG.md packaging/tarball/README.md \
            "dist/$name/"
          case $RUNNER_OS in
            macOS) set -- --no-mac-metadata --uid 0 --gid 0 --uname root --gname wheel ;;
            Linux) set -- --owner 0 --group 0 --numeric-owner ;;
          esac
          COPYFILE_DISABLE=1 tar -C dist "$@" -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" >"$name.tar.gz.sha256")
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: publish release
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # read the draft release and publish it
      attestations: read # verify the attestations of the tarballs
    outputs:
      sha256-arm: ${{ steps.verify.outputs.sha256-arm }}
      sha256-intel: ${{ steps.verify.outputs.sha256-intel }}
      sha256-linux-x86_64: ${{ steps.verify.outputs.sha256-linux-x86_64 }}
      sha256-linux-aarch64: ${{ steps.verify.outputs.sha256-linux-aarch64 }}
      sha256-source: ${{ steps.verify.outputs.sha256-source }}
    steps:
      - name: Verify the tarballs and their attestations
        id: verify
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$TAG" --pattern '*.tar.gz'
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl; do
            file="$PACKAGE-${TAG#v}-$target.tar.gz"
            gh attestation verify "$file" --repo "$GH_REPO" --source-ref "$GITHUB_REF" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
            sha256=$(sha256sum "$file" | cut -d ' ' -f 1)
            case $target in
              aarch64-apple-darwin) echo "sha256-arm=$sha256" >>"$GITHUB_OUTPUT" ;;
              x86_64-apple-darwin) echo "sha256-intel=$sha256" >>"$GITHUB_OUTPUT" ;;
              x86_64-unknown-linux-musl) echo "sha256-linux-x86_64=$sha256" >>"$GITHUB_OUTPUT" ;;
              aarch64-unknown-linux-musl) echo "sha256-linux-aarch64=$sha256" >>"$GITHUB_OUTPUT" ;;
            esac
          done
          # The archive of the tag's sources that GitHub makes, which the AUR package builds; the
          # API's (gh release download --archive) has other names in it.
          curl --fail --silent --show-error --location --output source.tar.gz \
            "https://github.com/$GH_REPO/archive/refs/tags/$TAG.tar.gz"
          echo "sha256-source=$(sha256sum source.tar.gz | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    name: update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    # The app's client ID and private key live only in this environment.
    environment: release
    permissions:
      contents: read # read the formula template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the formula
        run: |
          sed -e "s|@REPOSITORY@|$GH_REPO|g" -e "s/@VERSION@/${TAG#v}/g" \
            -e "s/@SHA256_ARM@/$SHA256_ARM/g" \
            -e "s/@SHA256_INTEL@/$SHA256_INTEL/g" "packaging/homebrew/$PACKAGE.rb.in" \
            >"$RUNNER_TEMP/$PACKAGE.rb"
          if grep -n '@[A-Z0-9_]*@' "$RUNNER_TEMP/$PACKAGE.rb"; then
            echo "::error::The formula has placeholders left"
            exit 1
          fi
        env:
          SHA256_ARM: ${{ needs.publish.outputs.sha256-arm }}
          SHA256_INTEL: ${{ needs.publish.outputs.sha256-intel }}
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      # The commit goes through the API with no author or committer: only then does GitHub sign
      # it for the app, so it shows as verified. A push from here would be unsigned.
      - name: Commit the formula to the tap
        run: |
          api="repos/$GITHUB_REPOSITORY_OWNER/homebrew-tap/contents/Formula/$PACKAGE.rb"
          set -- --method PUT "$api" -f message="$PACKAGE ${TAG#v}" \
            -f content="$(base64 -w 0 "$RUNNER_TEMP/$PACKAGE.rb")"
          if sha=$(gh api "$api" --jq .sha 2>/dev/null); then
            set -- "$@" -f sha="$sha"
          fi
          gh api "$@" --silent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  aur:
    name: update the AUR (${{ matrix.package }})
    needs: publish
    runs-on: ubuntu-latest
    # makepkg runs on Arch Linux. The image is base-devel-20261108.0.623074, pinned by digest and
    # raised by hand; pacman brings its packages up to date before anything else.
    container: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    # The AUR key lives only in this environment.
    environment: release
    permissions:
      contents: read # read the templates
    strategy:
      fail-fast: false
      matrix:
        package: [noon-commander, noon-commander-bin, noon-commander-git]
    env:
      AUR_PACKAGE: ${{ matrix.package }}
      AUR_CLONE: /home/builder/aur
    steps:
      # pacman's sandbox for its downloads (Landlock, seccomp) cannot always be set up in a
      # container; the packages it installs are still checked against their signatures.
      - name: Update Arch Linux and install what the packages need
        run: |
          pacman -Sy --disable-sandbox --noconfirm archlinux-keyring
          pacman -Su --disable-sandbox --noconfirm --needed git openssh rust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # makepkg refuses to run as root. The key is not there yet.
      - name: Build the package and commit it to a clone of its AUR repository
        run: |
          useradd --create-home builder
          runuser -u builder -- env HOME=/home/builder VERSION="${TAG#v}" REPOSITORY="$GH_REPO" \
            SHA256_SOURCE="$SHA256_SOURCE" SHA256_X86_64="$SHA256_X86_64" \
            SHA256_AARCH64="$SHA256_AARCH64" packaging/aur/update.sh "$AUR_PACKAGE" "$AUR_CLONE"
        env:
          SHA256_SOURCE: ${{ needs.publish.outputs.sha256-source }}
          SHA256_X86_64: ${{ needs.publish.outputs.sha256-linux-x86_64 }}
          SHA256_AARCH64: ${{ needs.publish.outputs.sha256-linux-aarch64 }}
      # Pushing what is already there does nothing, as when the PKGBUILD of -git is unchanged.
      - name: Push the commit to the AUR
        run: |
          key="$RUNNER_TEMP/aur-key"
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >"$key")
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          GIT_SSH_COMMAND="$GIT_SSH_COMMAND -o UserKnownHostsFile=$PWD/packaging/aur/known_hosts"
          export GIT_SSH_COMMAND
          git -C "$AUR_CLONE" -c safe.directory="$AUR_CLONE" push \
            "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" HEAD:refs/heads/master
          rm -f "$key"
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
