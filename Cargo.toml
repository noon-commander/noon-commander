[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/0ldkettle/sftp-tui"

[workspace.dependencies]
sftp-tui-config = { path = "crates/sftp-tui-config" }
sftp-tui-ops = { path = "crates/sftp-tui-ops" }
sftp-tui-ssh = { path = "crates/sftp-tui-ssh" }
sftp-tui-vfs = { path = "crates/sftp-tui-vfs" }

clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
