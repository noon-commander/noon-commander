[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/0ldkettle/sftp-tui"

[workspace.dependencies]
sftp-tui-config = { path = "crates/sftp-tui-config" }
sftp-tui-ops = { path = "crates/sftp-tui-ops" }
sftp-tui-ssh = { path = "crates/sftp-tui-ssh" }
sftp-tui-vfs = { path = "crates/sftp-tui-vfs" }

clap = { version = "4.6", features = ["derive"] }
color-eyre = { version = "0.6", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
getrandom = "0.4"
glob = "0.3"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
insta = "1.48"
openssh-sftp-client = "0.15"
ratatui = "0.30"
rust-embed = { version = "8", features = ["debug-embed"] }
rustix = { version = "1.1", features = ["process"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
