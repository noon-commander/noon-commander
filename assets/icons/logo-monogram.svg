<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" height="1024" viewBox="0 0 32 32" width="1024">
  <title>Noon Commander</title>

  <defs>
    <linearGradient id="frameGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#996400" />
      <stop offset="1" stop-color="#743C08" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#223860" />
      <stop offset="1" stop-color="#132040" />
    </linearGradient>
  </defs>

  <g id="frame">
