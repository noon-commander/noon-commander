      <rect height="2" width="2" x="3.25" y="13" />
      <rect height="2" width="2" x="9.25" y="13" />
      <rect height="2" width="2" x="11.25" y="13" />
      <rect height="2" width="2" x="3.25" y="15" />
      <rect height="2" width="2" x="11.25" y="15" />
      <rect height="2" width="2" x="3.25" y="17" />
