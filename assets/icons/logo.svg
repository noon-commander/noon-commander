<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" height="1024" viewBox="0 0 32 32" width="1024">
  <title>Noon Commander</title>

  <defs>
    <linearGradient id="frameGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFB833" />
      <stop offset="1" stop-color="#E8780F" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#223860" />
      <stop offset="1" stop-color="#132040" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4" />
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0" />
    </linearGradient>
    <radialGradient cx="0.5" cy="0.5" id="glowGrad" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95" />
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g id="frame">
    <rect fill="url(#frameGrad)" height="32" width="32" />
    <circle cx="16" cy="2.5" fill="url(#glowGrad)" r="5" />
  </g>

  <g fill="url(#panelGrad)" id="panels">
    <rect height="22" width="9" x="1" y="1" />
    <rect height="22" width="3" x="11" y="1" />
    <rect height="22" width="9" x="18" y="1" />
    <rect height="22" width="3" x="28" y="1" />
  </g>

  <g id="content">
    <g fill="#FFC24A" id="headers">
      <rect height="1" width="5" x="3" y="2" />
      <rect height="1" width="2" x="11.5" y="2" />
      <rect height="1" width="5" x="20" y="2" />
      <rect height="1" width="2" x="28.5" y="2" />
    </g>
    <g fill="#3C5684" id="file-rows">
      <rect height="1" width="7" x="2" y="5" />
      <rect height="1" width="5" x="2" y="7" />
      <rect height="1" width="6" x="2" y="11" />
      <rect height="1" width="4" x="2" y="13" />
      <rect height="1" width="6" x="2" y="15" />
      <rect height="1" width="5" x="2" y="17" />
      <rect height="1" width="2" x="11.5" y="5" />
      <rect height="1" width="2" x="11.5" y="7" />
      <rect height="1" width="2" x="11.5" y="11" />
      <rect height="1" width="2" x="11.5" y="13" />
      <rect height="1" width="2" x="11.5" y="15" />
      <rect height="1" width="2" x="11.5" y="17" />
      <rect height="1" width="7" x="19" y="5" />
      <rect height="1" width="5" x="19" y="7" />
      <rect height="1" width="2" x="28.5" y="5" />
      <rect height="1" width="2" x="28.5" y="7" />
    </g>
    <g fill="#FFC24A" id="selection">
      <rect height="1" width="7" x="2" y="9" />
      <rect height="1" width="2" x="11.5" y="9" />
    </g>
  </g>

  <g id="status">
    <rect fill="url(#panelGrad)" height="3" width="13" x="1" y="24" />
    <rect fill="url(#panelGrad)" height="3" width="13" x="18" y="24" />
    <g fill="#3C5684">
      <rect height="1" width="6" x="2" y="25" />
      <rect height="1" width="3" x="10" y="25" />
      <rect height="1" width="6" x="19" y="25" />
      <rect height="1" width="3" x="27" y="25" />
    </g>
  </g>

  <g fill="#1A2B4E" id="keybar">
    <rect height="3" width="4" x="1" y="28" />
    <rect height="3" width="4" x="6.2" y="28" />
    <rect height="3" width="4" x="11.4" y="28" />
    <rect height="3" width="4" x="16.6" y="28" />
    <rect height="3" width="4" x="21.8" y="28" />
    <rect height="3" width="4" x="27" y="28" />
  </g>

  <g id="noon">
    <rect fill="url(#rayGrad)" height="20" width="1" x="15.5" y="3" />
    <circle cx="16" cy="2.5" fill="#FFFBEA" r="1.6" />
  </g>

  <path d="M22.5 19.5V11.5M19.5 14.5L22.5 11.5L25.5 14.5" fill="none" id="transfer-arrow"
    stroke="#FFC24A" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
</svg>
