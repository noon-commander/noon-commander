# Noon Commander configuration
#
# Noon Commander uses the system OpenSSH client, so hosts, users, keys, and connection options
# come from ssh_config. Noon Commander only decorates those hosts (labels, start directories,
# hiding); it never duplicates them.
#
# Every setting is optional. Uncommented values are the defaults; commented lines are examples.
# Options → Configuration… (F9) changes settings too; it rewrites only the keys it changes and
# keeps these comments.

[ssh]
# The OpenSSH client, version 8.7 or later: a name looked up in PATH, or a path. Here and in
# config_file, a leading ~/ stands for the home directory.
program = "ssh"

# Read this file instead of ~/.ssh/config and /etc/ssh/ssh_config, like `ssh -F`. It also
# decides which hosts are listed.
# config_file = "~/.ssh/work_config"

# Extra arguments for every ssh invocation, for example ["-o", "ServerAliveInterval=15"].
# Options that Noon Commander manages itself, such as -F (use config_file), -M, or ControlPath,
# are rejected. So are forwarding options, such as -L, -D, -A, or ForwardAgent, unless Noon
# Commander was built with the `forwarding` feature.
args = []

# Share one authenticated connection (ControlMaster) per host between panels and transfers.
# Set to false for servers that allow one session per connection (MaxSessions 1); every panel
# and transfer then opens its own connection and authenticates again.
multiplex = true

[discovery]
# Hosts from ssh_config to leave out of the location menu. Patterns may use `*` and `?`.
hide = ["github.com", "gitlab.com", "bitbucket.org"]

[volumes]
# Mounted volumes to leave out of the location menu, by mount point, such as "/Volumes/Backup*" or
# "/mnt/*". Patterns may use `*` and `?`. The system volume is always listed.
hide = []

[ui]
# Interface language, such as "en-US", or "auto" for the system locale. Only English exists so
# far; other languages fall back to it.
language = "auto"
# How dates, times, and numbers are written, and the order of names: "auto" as the system writes
# them (on macOS, as System Settings → Language & Region sets them; elsewhere, by LC_TIME,
# LC_NUMERIC, LC_COLLATE, LC_ALL, and LANG), "iso" for neutral ones (2025-10-17 14:05, 1234.5),
# or a language tag that names a region's.
formats = "auto"
# Sort names as the language of the formats orders them, with the numbers in them by value
# (file2 before file10); false sorts them by their characters, ignoring case.
natural_sort = true
# Colors: "mc-classic" (blue panels, as Midnight Commander), "terminal" (the terminal's own),
# "noon-dark" and "noon-light" (the logo's navy, gold, and amber), "catppuccin-mocha" (dark), or
# "catppuccin-latte" (light). All but the first two use 24-bit color where COLORTERM says the
# terminal has it, else the nearest of 256 colors.
theme = "mc-classic"
# Frames of panels and dialogs: "double" (═ ║ ╔, as Midnight Commander) or "single" (─ │ ┌).
borders = "double"
# Nerd Font icons in front of names; needs a Nerd Font in the terminal. Without them, mc's
# markers: / directory, * executable, @ symlink, ~ symlink to a directory.
icons = true
# Show files whose names begin with a dot. o h switches it while Noon Commander runs.
show_hidden = true
# How quick search and the filters of the lists (the location menu, the tab menu, the zoxide
# window, the workspaces, the command history, the list of the key hints) match what is typed.
# "fzf": its characters in order, not necessarily together, best matches first; words
# separated by spaces must all match, and fzf's ' ^ $ ! work. "plain": the text anywhere,
# ignoring case; the zoxide window gives it to zoxide as keywords, as z does. "regex": a
# regular expression, whose case counts only once it has a capital letter. Each search and each
# window starts with it; Ctrl+s switches it there. The search of a tree (f /, f f) starts with it
# too, taking "fzf" as "regex", and Ctrl+s switches it between "plain" and "regex".
search_mode = "fzf"
# The menu bar of F9 (Left, File, Command, Options, Right): "on-demand" shows it only while a
# menu is open, over the panels, as Far Manager does; "always" keeps it above the panels, as
# Midnight Commander does.
menu_bar = "on-demand"
# Where a panel with more than one tab (t n) shows them: "line" on a line of its own above
# the panels, or "frame" in the top of the panel's frame, in place of its title.
tab_bar = "line"
# The mouse: a click moves the cursor, a double click opens, a right click marks, and the wheel
# scrolls; the F-key bar and the tabs take clicks too. While it is on, the terminal selects
# text only with a modifier held: Shift in most terminals, Option in iTerm2.
mouse = true
# How far a step of the mouse wheel scrolls: a number of lines from 1 to 20, or "page".
wheel = 3
# Title the terminal's window or tab with the active panel's directory, such as "~/src — noc",
# and give the terminal its own title back on quitting, where it keeps a stack of titles.
terminal_title = true
# After a key that starts longer sequences, such as g or Ctrl+w, show the keys that can follow
# it and what they do, as which-key does; the key then waits for the next one. Ctrl+k shows every
# key of whatever is in front either way.
which_key = true
# How long after such a key the keys that can follow it show, in milliseconds.
which_key_delay_ms = 500

[animations]
# Let a window's frame grow from its middle as it opens and shrink back as it closes, which
# takes a moment; keys work at once all the same.
windows = true
# Turn the spinner in front of what Noon Commander waits for, such as a directory being read or
# a host it connects to. When off, a still mark stands there.
spinners = true

[transfer]
# Write each copy under a hidden temporary name next to its target and rename it when it is
# complete, so that the target never holds part of a file. When off, copies are written to
# their targets directly; a copy that does not finish is still removed.
atomic_upload = true

# How many jobs (copying, moving, deleting) run at once; later ones wait their turn. Editing
# with F4 never waits. At least 1.
parallel_jobs = 2

[zoxide]
# zoxide (https://github.com/ajeetdsouza/zoxide) ranks the directories you use; g z jumps to
# them. A name looked up in PATH, or a path; a leading ~/ stands for the home directory.
program = "zoxide"
# Add a local directory to zoxide once you do something in it: copy, move, or delete from it,
# copy into it, make a directory, view or edit a file, take checksums, or jump there. Passing
# through does not count. Nothing happens without zoxide.
record = true

[shell]
# How many commands of the command line (! and :) history.toml in the state directory keeps,
# of all hosts together; each is kept with the host it ran on. 0 keeps none, and a command
# that starts with a space is never kept.
history_size = 500
# When the output of a command stays on screen until a key: "always", "on-error" (after a
# command that failed), or "never". g < shows it again later either way.
pause = "always"

[search]
# f / searches the files below the panel's directory for text with ripgrep
# (https://github.com/BurntSushi/ripgrep), in a window of its own. The program for local
# directories: a name looked up in PATH, or a path; a leading ~/ stands for the home directory.
# On a host, rg runs there, as the host's PATH finds it.
program = "rg"
# f f opens the same window in its Files and dirs mode, which finds files and directories by
# name with fd (https://github.com/sharkdp/fd).
# The program for local directories, as above; on a host, fd runs there, or fdfind as Debian
# and Ubuntu name it.
fd = "fd"
# It stops after finding this many lines, or files and directories when it lists them; at
# least 1.
max_results = 10000
# The most lines it finds in one file, so that one large file leaves room for others; at least 1.
max_per_file = 100

[viewer]
# The viewer (F3) reads a file in parts of this many mebibytes: the first before it shows the
# file, the next each time scrolling reaches the end of what it read; at least 1.
part_mib = 16
# It holds this many mebibytes of parts at once; the ones farthest away go, and are read again
# when scrolling comes back to them. At least two parts; less counts as two.
window_mib = 128

# Per-host settings (labels, start directories) live in hosts.toml next to this file.
