# Noon Commander configuration
#
# Noon Commander uses the system OpenSSH client, so hosts, users, keys, and connection options
# come from ssh_config. Noon Commander only decorates those hosts (labels, start directories,
# hiding); it never duplicates them.
#
# Every setting is optional. Uncommented values are the defaults; commented lines are examples.
# Options → Configuration… (F9) changes settings too; it rewrites only the keys it changes and
# keeps these comments.

[ssh]
# The OpenSSH client, version 8.7 or later: a name looked up in PATH, or a path. Here and in
# config_file, a leading ~/ stands for the home directory.
program = "ssh"

# Read this file instead of ~/.ssh/config and /etc/ssh/ssh_config, like `ssh -F`. It also
# decides which hosts are listed.
# config_file = "~/.ssh/work_config"

# Extra arguments for every ssh invocation, for example ["-o", "ServerAliveInterval=15"].
# Options that Noon Commander manages itself, such as -F (use config_file), -M, or ControlPath,
# are rejected. So are forwarding options, such as -L, -D, -A, or ForwardAgent, unless Noon
# Commander was built with the `forwarding` feature.
args = []

# Share one authenticated connection (ControlMaster) per host between panels and transfers.
# Set to false for servers that allow one session per connection (MaxSessions 1); every panel
# and transfer then opens its own connection and authenticates again.
multiplex = true

[discovery]
# Hosts from ssh_config to leave out of the host list. Patterns may use `*` and `?`.
hide = ["github.com", "gitlab.com", "bitbucket.org"]

[volumes]
# Mounted volumes to leave out of the root, by mount point, such as "/Volumes/Backup*" or
# "/mnt/*". Patterns may use `*` and `?`. The system volume is always listed.
hide = []

[ui]
# Interface language, such as "en-US", or "auto" for the system locale. Only English exists so
# far; other languages fall back to it.
language = "auto"
# Colors: "mc-classic" (blue panels, as Midnight Commander), "terminal" (the terminal's own),
# "catppuccin-mocha" (dark), or "catppuccin-latte" (light). The Catppuccin themes use 24-bit
# color where COLORTERM says the terminal has it, else the nearest of 256 colors.
theme = "mc-classic"
# Frames of panels and dialogs: "double" (═ ║ ╔, as Midnight Commander) or "single" (─ │ ┌).
borders = "double"
# Nerd Font icons in front of names; needs a Nerd Font in the terminal. Without them, mc's
# markers: / directory, * executable, @ symlink, ~ symlink to a directory.
icons = true
# Show files whose names begin with a dot. Alt-. switches it while Noon Commander runs.
show_hidden = true
# Typing in a panel starts quick search. When off, only Ctrl-S and Alt-S do, as in mc.
type_to_search = true
# The menu bar of F9 (Left, File, Command, Options, Right): "on-demand" shows it only while a
# menu is open, over the panels, as Far Manager does; "always" keeps it above the panels, as
# Midnight Commander does.
menu_bar = "on-demand"
# Where a panel with more than one tab (Ctrl-X T) shows them: "line" on a line of its own above
# the panels, or "frame" in the top of the panel's frame, in place of its title.
tab_bar = "line"

[transfer]
# Write each copy under a hidden temporary name next to its target and rename it when it is
# complete, so that the target never holds part of a file. When off, copies are written to
# their targets directly; a copy that does not finish is still removed.
atomic_upload = true

# How many jobs (copying, moving, deleting) run at once; later ones wait their turn. Editing
# with F4 never waits. At least 1.
parallel_jobs = 2

# Per-host settings (labels, start directories) live in hosts.toml next to this file.
