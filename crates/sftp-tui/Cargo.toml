[package]
name = "sftp-tui"
description = "Midnight Commander-style SFTP file manager built on the system OpenSSH client"
keywords = ["sftp", "ssh", "tui", "file-manager", "midnight-commander"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Allow port, agent, X11, and tunnel forwarding. Off by default; see docs/adr/0004.
forwarding = ["sftp-tui-ssh/forwarding"]

[dependencies]
clap.workspace = true
color-eyre.workspace = true
crossterm.workspace = true
futures-util.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
ratatui.workspace = true
rust-embed.workspace = true
rustix = { workspace = true, features = ["termios"] }
secrecy.workspace = true
sftp-tui-config.workspace = true
sftp-tui-ssh.workspace = true
sftp-tui-vfs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
