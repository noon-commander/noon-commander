# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []

[licenses]
# Every license here must be compatible with GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "libssh2-sys", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
    { crate = "russh", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
    { crate = "ssh2", reason = "Noon Commander drives the system OpenSSH client, see docs/adr/0001" },
]
# Duplicates pulled in by up-to-date dependencies; drop an entry once cargo-deny reports it unused.
skip = [
    { crate = "hashbrown@0.16.1", reason = "kasuari (via ratatui-core) has not moved to hashbrown 0.17" },
    { crate = "syn@2.0.119", reason = "the ecosystem is still migrating to syn 3" },
    { crate = "thiserror@1.0.69", reason = "i18n-embed and i18n-config still use thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "i18n-embed and i18n-config still use thiserror 1" },
    { crate = "toml@0.5.11", reason = "find-crate 0.6 (via i18n-embed-fl) uses toml 0.5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
